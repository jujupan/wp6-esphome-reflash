# Gosund WP6 (T201-V1.0 module, ESP8285).
# Confirmed 2026-11-17: button GPIO3, relay GPIO14, red LED GPIO13 (on = low).
# Red LED shows the Power state. Updates go over Wi-Fi (OTA).

esphome:
  name: wp6-lamp
  friendly_name: WP6 Lamp

esp8266:
  board: esp8285
  restore_from_flash: true   # remember on/off across power cuts

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:                        # fallback hotspot "WP6 Lamp Fallback Hotspot"
    password: !secret wifi_fallback_pw

captive_portal:

logger:
  baud_rate: 0               # GPIO1 = TX, GPIO3 = RX = button

api:                         # local connection to Home Assistant

ota:
  - platform: esphome

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    name: Button
    on_press:
      - switch.toggle: relay

switch:
  - platform: gpio
    pin: GPIO14              # confirmed 2026-11-17: relay clicks
    id: relay
    name: Power
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - output.turn_on: red_led
    on_turn_off:
      - output.turn_off: red_led

# Only LED on this unit: red on GPIO13, on = low (confirmed 2026-11-17).
# GPIO1 (TX) lit no LED in testing; the blue LED is absent or dead.
output:
  - platform: gpio
    pin: GPIO13
    inverted: true
    id: red_led
